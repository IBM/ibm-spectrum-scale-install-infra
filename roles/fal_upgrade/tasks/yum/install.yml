---
#
# Install or update RPMs
#

- block:
    - name: upgrade | Check if gpfs librdkafka installed
      shell: rpm -q gpfs.librdkafka
      register: gpfslibrdkafka_installed
      ignore_errors: true
      failed_when: false

    - name: upgrade | Set if gpfs librdkafka installed
      set_fact:
        librdkafka_installed: true
      when:
        - gpfslibrdkafka_installed.rc == 0
  when:
    - ansible_pkg_mgr in ['yum', 'dnf', 'dnf5']
    - offline_upgrade is defined and offline_upgrade | bool

- name: upgrade | Upgrade GPFS file audit logging packages (yum/dnf - no librdkafka)
  dnf:
    name: "{{ scale_install_all_packages }}"
    state: latest
    disable_gpg_check: "{{ scale_disable_gpgcheck }}"
  when:
    - ansible_pkg_mgr in ['yum', 'dnf']
    - librdkafka_installed is not defined

- name: upgrade | Upgrade GPFS file audit logging packages (dnf5 - no librdkafka)
  ansible.builtin.dnf5:
    name: "{{ scale_install_all_packages }}"
    state: latest
    disable_gpg_check: "{{ scale_disable_gpgcheck }}"
  when:
    - ansible_pkg_mgr == 'dnf5'
    - librdkafka_installed is not defined

- name: upgrade | Upgrade GPFS file audit logging packages (yum/dnf - with librdkafka)
  dnf:
    name: "{{ scale_install_all_packages }}"
    state: latest
    update_only: yes
    disable_gpg_check: "{{ scale_disable_gpgcheck }}"
  when:
    - ansible_pkg_mgr in ['yum', 'dnf']
    - librdkafka_installed is defined and librdkafka_installed | bool

- name: upgrade | Upgrade GPFS file audit logging packages (dnf5 - with librdkafka)
  ansible.builtin.dnf5:
    name: "{{ scale_install_all_packages }}"
    state: latest
    disable_gpg_check: "{{ scale_disable_gpgcheck }}"
  when:
    - ansible_pkg_mgr == 'dnf5'
    - librdkafka_installed is defined and librdkafka_installed | bool
