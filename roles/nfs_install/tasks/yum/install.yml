---
- name: install | Install GPFS nfs packages (yum/dnf)
  dnf:
   name: "{{ scale_install_all_packages }}"
   state: present
   disable_gpg_check: "{{ scale_disable_gpgcheck }}"
  when:
    - inventory_hostname in scale_nfs_nodes_list
    - ansible_pkg_mgr in ['yum', 'dnf']

- name: install | Install GPFS nfs packages (dnf5)
  ansible.builtin.dnf5:
   name: "{{ scale_install_all_packages }}"
   state: present
   disable_gpg_check: "{{ scale_disable_gpgcheck }}"
  when:
    - inventory_hostname in scale_nfs_nodes_list
    - ansible_pkg_mgr == 'dnf5'
  ignore_errors: true
  failed_when: false
