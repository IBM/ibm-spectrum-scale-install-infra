---
# YUM repository installation method

#
# Configure license package installation repository
#
- name: upgrade | Get license package
  dnf:
    list: gpfs.license.*
  register: package_name_version
  when:
    - ansible_pkg_mgr == 'yum' or ansible_pkg_mgr == 'dnf'

- name: Find license package
  shell:
   cmd: apt-cache show gpfs.license.*
  register: package_name
  when:
  - ansible_pkg_mgr == 'apt'

- name: upgrade | Get license package
  shell:
   cmd: zypper info gpfs.license.* | grep Name | cut -d ':' -f 2 | tr -d '[:space:]'
  register: package_name_version_zypp
  when:
    - ansible_pkg_mgr == 'zypper'

- name: upgrade | Extract license package name
  set_fact:
     scale_gpfs_license_package:  "{{package_name_version|json_query(jsonquery)}}"
  vars:
     jsonquery: "results[?yumstate=='available'].name"
  when:
     - ansible_pkg_mgr == 'yum' or ansible_pkg_mgr == 'dnf'
     - scale_gpfs_license_pkg is not defined

- name: upgrade | Extract license package name
  set_fact:
     scale_gpfs_license_package:  "{{ scale_gpfs_license_pkg }}"
  when:
     - ansible_pkg_mgr in ['yum', 'dnf', 'dnf5']
     - scale_gpfs_license_pkg is defined

- block:
    - name: upgrade | Find GPFS License package
      set_fact:
       scale_gpfs_license_package: "{{ package_name.stdout_lines.0[9:] }}"
      when:
         - scale_gpfs_license_pkg is not defined

    - name: upgrade | Extract license package name
      set_fact:
        scale_gpfs_license_package:  "{{ scale_gpfs_license_pkg }}"
      when:
        - scale_gpfs_license_pkg is defined
  when:
    - ansible_pkg_mgr == 'apt'

- block:
    - name: upgrade | Find GPFS License package
      set_fact:
        scale_gpfs_license_package: "{{ package_name_version_zypp.stdout }}"
      when:
         - scale_gpfs_license_pkg is not defined

    - name: upgrade | Extract license package name
      set_fact:
        scale_gpfs_license_package:  "{{ scale_gpfs_license_pkg }}"
      when:
        - scale_gpfs_license_pkg is defined
  when:
    - ansible_pkg_mgr == 'zypper'

- name: Check DNF package availability
  block:
    - name: Check if package is available in DNF repository
      shell: |
        dnf list available gpfs.license* --showduplicates | grep -v "^Last metadata" | grep "gpfs.license*"
      register: available_packages
      failed_when: false
      changed_when: false

    - name: Extract package information
      set_fact:
        available_package_name: "{{ available_packages.stdout_lines[0].split()[0].rsplit('.', 1)[0] }}"
      failed_when: false
      changed_when: false
      when: available_packages.rc == 0 and available_packages.stdout_lines | length > 0

    - name: Show available package information
      debug:
        msg: 
          - "Package Name: {{ available_package_name }}"
      failed_when: false
      changed_when: false
      when: available_package_name is defined

    - set_fact:
            scale_gpfs_license_package: "{{ available_package_name }}"
      failed_when: false
      changed_when: false
      when:
         - available_packages.rc == 0 and available_packages.stdout_lines | length != 0
         - "'gpfs.license.ds' in available_package_name"
         - scale_gpfs_license_package is not in available_package_name
  when: "'gpfs.license.dmd' in scale_gpfs_license_package"

- name: upgrade | Add GPFS license packages to list
  set_fact:
    scale_install_license_packages: "{{ scale_install_license_packages + [ item ] }}"
  with_items:
    - "{{ scale_gpfs_license_package }}"
    - gpfs.adv
    - gpfs.crypto
  when: 
    - '"gpfs.license.std" not in scale_gpfs_license_package'
    - '"gpfs.license.da" not in scale_gpfs_license_package'
    - '"gpfs.license.ds" not in scale_gpfs_license_package'

- name: upgrade | Add GPFS license packages to list
  set_fact:
    scale_install_license_packages: "{{ scale_install_license_packages + [ item ] }}"
  when: "'gpfs.license.std' in scale_gpfs_license_package or  
         'gpfs.license.da' in scale_gpfs_license_package or 'gpfs.license.ds' in scale_gpfs_license_package"
  with_items:
      - "{{ scale_gpfs_license_package }}"
