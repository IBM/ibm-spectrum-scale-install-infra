---
- name: upgrade | smb path rhel
  set_fact:
   scale_smb_url: 'smb_rpms/rhel{{ ansible_distribution_major_version }}/'
  when: ansible_distribution in scale_rhel_distribution

- name: upgrade | smb path azure
  set_fact:
   scale_smb_url: 'smb_rpms/azure{{ ansible_distribution_major_version }}/'
  when: ansible_distribution in scale_azure_distribution

- name: upgrade | smb path for sles
  set_fact:
   scale_smb_url: 'smb_rpms/sles{{ ansible_distribution_major_version }}/'
  when: ansible_distribution in scale_sles_distribution

- name: upgrade | smb path for ubuntu
  set_fact:
    scale_smb_url: 'smb_debs/ubuntu/ubuntu{{ ansible_distribution_major_version }}/'
  when: ansible_distribution in scale_ubuntu_distribution

- name: upgrade | Configure smb YUM repository
  yum_repository:
    name: spectrum-scale-smb
    description: IBM Spectrum Scale (smb)
    baseurl: "{{ scale_install_repository_url }}{{ scale_smb_url }}"
    gpgcheck: "{{ scale_install_gpgcheck }}"
    repo_gpgcheck: no
    sslverify: no
    proxy: ""
    state: present
  notify: yum-clean-metadata
  environment:
    no_proxy: "*"
    NO_PROXY: "*"
  when:
    - ansible_pkg_mgr == 'yum' or ansible_pkg_mgr == 'dnf'
    - scale_install_repository_url is defined
    - scale_install_repository_url != 'existing'

- name: upgrade | Configure smb zypper repository
  zypper_repository:
    name: spectrum-scale-smb-rpms
    repo: "{{ scale_install_repository_url }}{{ scale_smb_url }}"
    runrefresh: yes
    state: present
    disable_gpg_check: yes
  environment:
    no_proxy: "*"
    NO_PROXY: "*"
  when:
    - ansible_pkg_mgr == 'zypper'
    - scale_install_repository_url is defined
    - scale_install_repository_url != 'existing'

- name: upgrade | Configure smb APT repository
  apt_repository:
    filename: spectrum-scale-smb-debs
    repo: "deb [trusted=yes] {{ scale_install_repository_url }}{{ scale_smb_url }} ./"
    validate_certs: no
    state: present
    update_cache: yes
    codename: IBM Spectrum Scale (SMB debs)
    mode: 0777
  environment:
    no_proxy: "*"
    NO_PROXY: "*"
  when:
    - ansible_pkg_mgr == 'apt'
    - scale_install_repository_url is defined
    - scale_install_repository_url != 'existing'

- name: upgrade | Add GPFS smb packages to list
  set_fact:
    scale_install_all_packages: "{{ scale_install_all_packages + [ item ] }}"
  with_items:
    - "{{ scale_smb_packages }}"
