---
# tasks file for precheck
# In exemption mode (machine signature + exemption code, no full callhome
# configuration) callhome is not configured, so its prechecks are skipped.
- import_tasks: check.yml
  when:
    - scale_callhome_params is defined and scale_callhome_params.is_enabled | bool
    - not (scale_callhome_params.exemption_mode | default(false) | bool)
  tags: prepare
