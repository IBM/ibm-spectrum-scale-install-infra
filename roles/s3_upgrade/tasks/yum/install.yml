---
- name: upgrade | Upgrade GPFS S3 packages (yum/dnf)
  dnf:
    name: "{{ scale_install_all_packages }}"
    state: latest
    disable_gpg_check: "{{ scale_disable_gpgcheck }}"
  when: ansible_pkg_mgr in ['yum', 'dnf']

- name: upgrade | Upgrade GPFS S3 packages (dnf5)
  dnf:
    use_backend: dnf5
    name: "{{ scale_install_all_packages }}"
    state: latest
    disable_gpg_check: "{{ scale_disable_gpgcheck }}"
  when: ansible_pkg_mgr == 'dnf5'
  ignore_errors: true
  failed_when: false
