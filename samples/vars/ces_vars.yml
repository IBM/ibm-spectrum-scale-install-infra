---
#
# saples/vars/ces_vars.yml
#

# Refer to `man mmces` man pages for a description of these Cluster Export
# Services (CES) parameters.

scale_protocols:
  smb: true
  nfs: true
  object: true
  export_ip_pool: [192.168.100.100,192.168.100.101]
  filesystem: cesSharedRoot
  mountpoint: /gpfs/cesSharedRoot

# For IPv6 with NFS/SMB/S3 protocols, also define `interface` (the NIC for
# these protocol nodes only) and use CIDR notation for export_ip_pool:
#
# scale_protocols:
#   smb: true
#   nfs: true
#   object: true
#   interface: [eth0]
#   interface_mode: true
#   export_ip_pool: ["2002:90b:e006:84:250:56ff:feb9:7787/64"]
#   filesystem: cesSharedRoot
#   mountpoint: /gpfs/cesSharedRoot
#
# Note: `interface` here applies ONLY to NFS/SMB/S3 protocol nodes (-N scoped).
# HDFS nodes use a separate `hdfs_interface` key defined in hdfs_cluster_vars.yml.
